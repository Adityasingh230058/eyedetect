id: DET-CRED-004
name: Wi-Fi Pre-Shared Key (PSK) Cleartext Password Extraction
description: Detects command-line execution of 'netsh wlan show profile key=clear' to dump saved corporate wireless network passwords.
version: 1
status: enabled
event_type: process_create

level: 11
severity: medium
confidence: 0.90

logic:
  all:
    - field: process.command_line
      operator: contains
      value: "wlan"

    - field: process.command_line
      operator: contains
      value: "key=clear"

evidence:
  - process.name
  - process.command_line
  - process.pid
  - process.user

mitre:
  tactic: Credential Access
  technique: T1555
  name: "Credentials from Password Stores: Wi-Fi Cleartext Password Extraction"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_IA-5

tags:
  - attack.credential_access
  - wifi_password
  - netsh
