id: DET-CRED-003
name: Windows Credential Manager or Vault Extraction
description: Detects command-line execution of vaultcmd.exe (/list /listcreds) or cmdkey.exe (/list) to extract stored Windows domain credentials and web passwords.
version: 1
status: enabled
event_type: process_create

level: 12
severity: high
confidence: 0.90

logic:
  all:
    - field: process.name
      operator: in
      value:
        - vaultcmd.exe
        - cmdkey.exe

    - any:
        - field: process.command_line
          operator: contains
          value: "/list"
        - field: process.command_line
          operator: contains
          value: "/listcreds"

evidence:
  - process.name
  - process.command_line
  - process.pid
  - process.user

mitre:
  tactic: Credential Access
  technique: T1555.004
  name: "Credentials from Password Stores: Windows Credential Manager"

compliance:
  - PCI-DSS_10.2.1
  - NIST_800-53_IA-5

tags:
  - attack.credential_access
  - credential_manager
  - vaultcmd
  - cmdkey
