id: DET-PROC-013
name: Parent PID (PPID) Spoofing Execution
description: Detects process creation where the declared parent process does not match the actual creator token or creates suspicious child processes (e.g. spoolsv spawning cmd.exe).
version: 1
status: enabled
event_type: process_create

level: 14
severity: critical
confidence: 0.94

active_response: TERMINATE_PROCESS

logic:
  all:
    - field: process.ppid_spoofed
      operator: equals
      value: true

evidence:
  - process.name
  - process.pid
  - parent.name
  - parent.pid
  - process.real_parent_name

mitre:
  tactic: Defense Evasion
  technique: T1134.004
  name: "Access Token Manipulation: Parent PID Spoofing"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_SI-4

tags:
  - attack.defense_evasion
  - ppid_spoofing
  - evasion
