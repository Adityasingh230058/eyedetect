id: DET-INJ-005
name: Process Doppelganging or Process Ghosting Section Execution
description: Detects process creation from transacted file handles (NtCreateTransaction) or deleted/ghosted file section handles to bypass image verification.
version: 1
status: enabled
event_type: process_create

level: 16
severity: critical
confidence: 0.96

active_response: TERMINATE_PROCESS

logic:
  any:
    - field: process.is_transacted_section
      operator: equals
      value: true
    - field: process.is_delete_pending_section
      operator: equals
      value: true

evidence:
  - process.name
  - process.pid
  - process.executable_path

mitre:
  tactic: Defense Evasion
  technique: T1055.013
  name: "Process Injection: Process Doppelganging and Ghosting"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_SI-4

tags:
  - attack.defense_evasion
  - process_ghosting
  - process_doppelganging
