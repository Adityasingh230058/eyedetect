id: DET-PRIV-004
name: Unquoted Windows Service Path Execution or Weak Service Hijack
description: Detects the execution of unquoted service binary paths containing spaces (e.g. C:\Program Files\Vulnerable App\service.exe executed as C:\Program.exe) or weak service DACL modifications.
version: 1
status: enabled
event_type: process_create

level: 13
severity: high
confidence: 0.92

logic:
  all:
    - field: process.is_unquoted_service_path
      operator: equals
      value: true

evidence:
  - process.name
  - process.command_line
  - process.pid
  - process.user

mitre:
  tactic: Privilege Escalation
  technique: T1574.009
  name: "Hijack Execution Flow: Path Interception by Unquoted Path"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_SI-4

tags:
  - attack.privilege_escalation
  - attack.persistence
  - unquoted_path
  - service_hijack
